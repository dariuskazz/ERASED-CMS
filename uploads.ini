; upload_max_filesize/post_max_size are raised well above the 20M/64M a
; media upload needs, to accommodate a full CMS core-update release ZIP
; (the whole codebase minus node_modules/.git/storage - roughly 90MB on
; this project). This is an SAPI-level PHP ceiling checked before any
; application code runs; CoreUpdateStager's own inspector limits
; (app/CoreUpdate/CoreUpdateStager.php) are a separate, additional
; application-level check underneath this one.
upload_max_filesize=150M
post_max_size=160M
memory_limit=256M
max_file_uploads=20
